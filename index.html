<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=download"
    />
    <title>Pixora</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">
        <img src="./assets/logo.png" alt="Pixmora Logo" />
      </div>
      <div class="inpbtn">
        <input type="text" placeholder="Search images..." class="search" />
        <button class="searchbtn">search</button>
      </div>
    </nav>

    <!-- Categories -->
    <div class="categories">
      <button>Nature</button>
      <button>Cars</button>
      <button>Tech</button>
      <button>Gaming</button>
      <button>Wallpapers</button>
      <button>Film</button>
      <button>Architecture</button>
      <button>Texture</button>
      <button>Animals</button>
    </div>
    <div class="grid"></div>

    <script src="script.js"></script>
  </body>
</html>
